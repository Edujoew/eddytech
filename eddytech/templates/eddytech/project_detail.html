{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.title }} | EDYTECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --accent-amber: #ffb300; --deep-slate: #0f172a; }
        body { background: var(--deep-slate); color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .tech-badge {
            background: rgba(255, 179, 0, 0.1);
            border: 1px solid var(--accent-amber);
            color: var(--accent-amber);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-right: 10px;
        }
        .project-hero {
            padding: 100px 0;
            background: linear-gradient(to bottom, #1e293b, var(--deep-slate));
        }
        .img-main {
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <nav class="p-4">
        <a href="{% url 'index' %}" class="text-white text-decoration-none fw-bold">
            <i class="bi bi-arrow-left me-2"></i> BACK TO PORTFOLIO
        </a>
    </nav>

    <div class="project-hero">
        <div class="container">
            <div class="row align-items-center g-5">
                <div class="col-lg-6">
                    <h1 class="display-4 fw-bold mb-3">{{ project.title }}</h1>
                    <div class="d-flex mb-4">
                        {% for tech in project.technologies.split %}
                            <span class="tech-badge">{{ tech }}</span>
                        {% endfor %}
                    </div>
                    <p class="lead text-secondary mb-5">{{ project.long_description|linebreaks }}</p>
                    
                    <div class="d-flex gap-3">
                        {% if project.link %}
                        <a href="{{ project.link }}" class="btn btn-warning fw-bold px-4 py-2">LIVE DEMO</a>
                        {% endif %}
                        {% if project.github_link %}
                        <a href="{{ project.github_link }}" class="btn btn-outline-light px-4 py-2">GITHUB REPO</a>
                        {% endif %}
                    </div>
                </div>
                <div class="col-lg-6">
                    <img src="{{ project.image.url }}" class="img-fluid img-main" alt="{{ project.title }}">
                </div>
            </div>
        </div>
    </div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found - EDYTECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --accent-amber: #ffb300;
            --deep-slate: #0f172a;
        }
        body {
            background-color: var(--deep-slate);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .error-container {
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: var(--accent-amber);
            line-height: 1;
            font-family: 'Consolas', monospace;
        }
        .glitch-text {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .btn-edy {
            border: 1px solid var(--accent-amber);
            background: transparent;
            color: var(--accent-amber);
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-edy:hover {
            background: var(--accent-amber);
            color: #000;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="glitch-text">System Error: Path Not Found</div>
        <p class="text-secondary mb-5">The requested module does not exist in the EDYTECH architecture.</p>
        <a href="/" class="btn-edy">
            <i class="bi bi-house-door me-2"></i> RETURN TO SOURCE
        </a>
    </div>

</body>
</html>
